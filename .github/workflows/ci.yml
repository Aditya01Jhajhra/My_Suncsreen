name: CI — Data Generation & Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run data generation
        run: |
          python src/generate_data.py

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short

      - name: Verify data files exist
        run: |
          ls -la data/raw/
          test -f data/raw/Indian_Cosmetics_Products.csv
          test -f data/raw/Customers.csv
          test -f data/raw/Orders.csv
          test -f data/raw/Competitor_Products.csv
          test -f data/raw/City_Metrics.csv
          test -f data/raw/Marketing_Channels.csv
          test -f data/raw/Customer_Insights.csv